---
tf_namespace_bridge:
  frame_filters:
    type: string_array
    default_value: []
    description: >
      Glob patterns ('*' = any chars, '?' = single char) matched against
      child_frame_id of each transform. Empty list disables filtering
      (pass-through). When a bridged frame's parent does not match the filter,
      the parent is auto-included to keep the TF tree connected; a one-time
      INFO log fires per frame and a debounced summary WARN lists all
      auto-included frames so the user can extend the filter.
    validation:
      unique<>:
