---
launch:

  - arg:
      name: namespace
      default: robot1
      description: Robot namespace - determines the source topics and frame prefix

  - arg:
      name: frame_filters
      default: "['']"
      description: >
        YAML list of glob patterns matched against child_frame_id. Default
        "['']" disables filtering (pass-through) - empty entries are silently
        skipped by the bridge. A bare "[]" cannot be used as the launch
        default: rclcpp's YAML parameter loader cannot type-tag empty arrays
        and would reject the override. Example: "['odom', 'wheel*']".

  - node:
      pkg: tf_namespace_bridge
      exec: tf_namespace_bridge
      name: tf_namespace_bridge
      namespace: $(var namespace)
      output: screen
      param:
        - name: frame_filters
          type: yaml
          value: $(var frame_filters)
